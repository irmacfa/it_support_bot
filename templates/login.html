<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
{% include "_layout_head.html" %}
<title>ورود | پنل مدیریت</title>
<style>
body.login-body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  width: 100%;
  position: relative;
  overflow: hidden;
  background: radial-gradient(1200px 800px at 50% 0%, #1b243a 0%, var(--bg) 55%);
}

.login-bg-orbs {
  position: absolute;
  inset: 0;
  pointer-events: none;
  filter: blur(60px);
}

.orb {
  position: absolute;
  width: 320px;
  height: 320px;
  border-radius: 50%;
  opacity: .4;
  animation: float 14s ease-in-out infinite;
}

.orb.one {
  top: -120px;
  right: -80px;
  background: radial-gradient(circle, rgba(59,130,246,.55) 0%, transparent 70%);
}

.orb.two {
  bottom: -160px;
  left: -120px;
  background: radial-gradient(circle, rgba(16,185,129,.4) 0%, transparent 72%);
  animation-delay: -5s;
}

.orb.three {
  top: 40%;
  right: 18%;
  width: 220px;
  height: 220px;
  background: radial-gradient(circle, rgba(99,102,241,.35) 0%, transparent 70%);
  animation-delay: -9s;
}

@keyframes float {
  0%, 100% { transform: translate3d(0,0,0) scale(1); }
  33% { transform: translate3d(-18px,14px,0) scale(1.05); }
  66% { transform: translate3d(12px,-10px,0) scale(.98); }
}

.login-shell {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  width: min(360px, calc(100% - 20px));
  animation: fadeUp .8s ease both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.login-brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  text-align: center;
}

.login-logo {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle, rgba(59,130,246,.9) 0%, rgba(37,99,235,.7) 100%);
  box-shadow: 0 30px 60px -30px rgba(59,130,246,.9);
  position: relative;
}

.login-logo::after {
  content: "";
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  border: 1px solid rgba(59,130,246,.4);
  animation: pulse 3s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: .6; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.05); }
}

.login-logo-text {
  font-size: 1.3rem;
  filter: drop-shadow(0 10px 30px rgba(59,130,246,.4));
}

.login-brand-title {
  font-weight: 800;
  font-size: 1.1rem;
}

.login-brand-sub {
  font-size: .86rem;
  color: var(--fui-muted-foreground);
}

.login-card {
  width: 100%;
  border-radius: 16px;
  border: 1px solid rgba(148,163,184,.25);
  background: radial-gradient(600px 280px at 50% 0%, rgba(59,130,246,.16) 0%, transparent 70%),
              linear-gradient(180deg, rgba(30,41,59,.9) 0%, rgba(15,23,42,.88) 100%);
  backdrop-filter: blur(14px);
  box-shadow: 0 60px 120px -80px rgba(59,130,246,.6);
  overflow: hidden;
}

.login-card-header {
  padding: 18px 22px 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
  text-align: center;
}

.login-card-title {
  font-size: 1rem;
  font-weight: 700;
}

.login-card-desc {
  font-size: .84rem;
  color: var(--fui-muted-foreground);
}

.login-card-body {
  padding: 14px 22px 22px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.login-field {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.login-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: .84rem;
  color: var(--fui-muted-foreground);
}

.login-label svg {
  width: 16px;
  height: 16px;
}

.login-input-wrap {
  position: relative;
  display: flex;
  align-items: center;
}

.login-input {
  width: 100%;
  height: 42px;
  padding: 0 14px 0 38px;
  border-radius: 999px;
  border: 1px solid rgba(148,163,184,.35);
  background: radial-gradient(400px 80px at 50% 0%, rgba(59,130,246,.14) 0%, transparent 70%),
              rgba(15,23,42,.8);
  color: var(--fui-foreground);
  font-family: inherit;
  font-size: .88rem;
  transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
}

.login-toggle {
  position: absolute;
  left: 12px;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  border-radius: 50%;
  color: var(--fui-muted-foreground);
  cursor: pointer;
  transition: color .2s ease, background .2s ease;
}

.login-toggle:hover {
  color: var(--fui-foreground);
  background: rgba(148,163,184,.15);
}

.login-toggle svg {
  width: 16px;
  height: 16px;
}

.login-input::placeholder {
  color: var(--fui-muted-foreground);
}

.login-input:focus {
  outline: none;
  border-color: rgba(59,130,246,.9);
  box-shadow: 0 0 0 4px rgba(59,130,246,.16);
  background: rgba(15,23,42,.9);
}

.login-submit {
  position: relative;
  overflow: hidden;
  height: 44px;
  border-radius: 999px;
  border: none;
  background: linear-gradient(90deg, rgba(59,130,246,.95) 0%, rgba(37,99,235,.95) 50%, rgba(59,130,246,.95) 100%);
  background-size: 200% 100%;
  color: #fff;
  font-weight: 700;
  font-size: .92rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: filter .2s ease, transform .2s ease;
}

.login-submit::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,.18) 50%, transparent 100%);
  transform: translateX(-100%);
  animation: shine 2.6s ease-in-out infinite;
}

@keyframes shine {
  0% { transform: translateX(-100%); }
  70%, 100% { transform: translateX(100%); }
}

.login-submit:hover {
  filter: brightness(1.08);
}

.login-submit:active {
  transform: translateY(1px);
}

.login-submit-text,
.login-submit-loader {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 6px;
}

.login-submit-loader {
  display: none;
}

.login-form.loading .login-submit-text {
  display: none;
}

.login-form.loading .login-submit-loader {
  display: flex;
}

.login-spinner {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,.4);
  border-top-color: #fff;
  animation: spin .8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.login-footer {
  text-align: center;
  font-size: .8rem;
  color: var(--fui-muted-foreground);
}

@media (max-width: 480px) {
  .login-card-header,
  .login-card-body {
    padding: 16px 18px 20px;
  }
  .login-shell { width: min(340px, calc(100% - 16px)); }
}
</style>
</head>
<body class="login-body">
  <div class="login-bg-orbs">
    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>
  </div>
  <div class="login-shell">
    <div class="login-brand">
      <div class="login-logo">
        <span class="login-logo-text">🛠️</span>
      </div>
      <div class="login-brand-title">پنل مدیریت IT Support Bot</div>
      <div class="login-brand-sub">ورود امن به پنل مدیریت</div>
    </div>

    <div class="login-card">
      <div class="login-card-header">
        <div class="login-card-title">خوش آمدید</div>
        <div class="login-card-desc">برای ادامه، رمز عبور را وارد کنید</div>
      </div>
      <div class="login-card-body">
        {% if message %}
        <div class="fui-alert fui-alert--destructive">
          <span>{{ message }}</span>
        </div>
        {% endif %}

        <form method="post" action="/login" class="login-form" id="loginForm">
          <div class="login-field">
            <label class="login-label" for="password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              رمز عبور
            </label>
            <div class="login-input-wrap">
              <input class="login-input" id="password" type="password" name="password" placeholder="رمز ورود را وارد کنید" required autofocus autocomplete="current-password">
              <button type="button" class="login-toggle" id="togglePass" aria-label="نمایش/پنهان رمز عبور">
                <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                  <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                  <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                  <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                  <line x1="2" y1="2" x2="22" y2="22"></line>
                </svg>
              </button>
            </div>
          </div>

          <button class="login-submit" type="submit">
            <span class="login-submit-text">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                <polyline points="10 17 15 12 10 7"></polyline>
                <line x1="15" y1="12" x2="3" y2="12"></line>
              </svg>
              ورود به پنل
            </span>
            <span class="login-submit-loader">
              <span class="login-spinner"></span>
              در حال ورود...
            </span>
          </button>
        </form>
      </div>
    </div>

    <div class="login-footer">IT Support Bot • پنل مدیریت</div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    if (form) {
      form.addEventListener('submit', function () {
        form.classList.add('loading');
        const btn = form.querySelector('.login-submit');
        if (btn) btn.disabled = true;
      });
    }
    const toggle = document.getElementById('togglePass');
    const passInput = document.getElementById('password');
    if (toggle && passInput) {
      toggle.addEventListener('click', function () {
        const isPass = passInput.type === 'password';
        passInput.type = isPass ? 'text' : 'password';
        toggle.querySelector('.eye-open').style.display = isPass ? 'none' : 'block';
        toggle.querySelector('.eye-closed').style.display = isPass ? 'block' : 'none';
      });
    }
  </script>
</body>
</html>
