<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
{% include "_layout_head.html" %}
<title>ورود | پنل مدیریت</title>
<style>
body.login-body {
    display: flex; justify-content: center; align-items: center;
    height: 100vh; width: 100%;
}
.login-card { width: 340px; }
.login-card h1 { font-size: 1.05rem; margin-bottom: 4px; text-align: center; color: var(--text); }
.login-card p { font-size: 0.8rem; color: var(--muted); text-align: center; margin-bottom: 20px; }
.login-card button { width: 100%; }
</style>
</head>
<body class="login-body">
<div class="card login-card">
    <h1>پنل مدیریت IT Support Bot</h1>
    <p>برای ورود رمز عبور رو وارد کن</p>

    {% if message %}
    <div class="msg error">{{ message }}</div>
    {% endif %}

    <form method="post" action="/login">
        <label>رمز عبور</label>
        <input type="password" name="password" required autofocus>
        <button type="submit">ورود</button>
    </form>
</div>
</body>
</html>
